        - quota tracker
        - usage dashboard
        - background usage refresher
      Description: AI Gauge is a lightweight Windows system tray widget for monitoring
        usage across OpenAI Codex, Anthropic Claude Code, and Google
        Antigravity. Live monitoring requires an existing signed-in Codex or
        Claude Code session, or the locally installed and signed-in agy
        command-line tool for Antigravity. AI Gauge shows remaining quota percentages, reset times,
        connection status, and the last successful update in a compact desktop
        window. You can show, hide, and reorder providers; configure refresh
        intervals and warning and critical thresholds; keep the widget above
        other windows; and choose a light, dark, or system theme. The sample
        preview shows bundled example data, not usage from any account. AI Gauge
        runs locally, does not store a separate copy of your credentials, and
        does not retain usage data on a remote server.
      Features:
        - Automatic quota and reset-time monitoring
        - Multiple AI usage providers with visibility and ordering controls
        - Configurable background refresh intervals
        - Windows system tray access with light, dark, and system themes
