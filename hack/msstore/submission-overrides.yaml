Listings:
  en-us:
    BaseListing:
      Description: AI Gauge is a lightweight Windows system tray widget for monitoring
        usage across OpenAI Codex, Anthropic Claude Code, and Google
        Antigravity. Connect Codex and Claude Code through their official browser
        login flows or import an existing local CLI session; Antigravity uses the
        locally installed and signed-in agy command-line tool. AI Gauge shows
        remaining quota percentages, reset times, connection status, and the last
        successful update in a compact desktop window. You can add multiple
        provider accounts, connect or import credentials, remove and reorder
        provider instances, configure refresh intervals and warning and critical
        thresholds, keep the widget above other windows, and choose a light, dark,
        or system theme. AI Gauge runs locally, stores Codex and Claude OAuth
        tokens in its protected local credential store, and does not retain usage
        data on a remote server.
      Features:
        - Automatic quota and reset-time monitoring
        - Multiple provider accounts with ordering controls
        - Official browser sign-in and local credential import
        - Configurable background refresh intervals
        - Windows system tray access with light, dark, and system themes
        - Global hotkey toggle to show and hide the window
      ReleaseNotes: Configure multiple provider accounts, connect through official browser sign-in or import an existing local session, and manage them from Settings.

NotesForCertification: |
  AI Gauge is a lightweight Windows system tray utility that monitors quota usage and reset times for OpenAI Codex, Anthropic Claude Code, and Google Antigravity.

  No test accounts are supplied. Codex or Claude Code credentials are required only to exercise provider connection and live usage monitoring; the app remains functional on a clean device and shows setup guidance until a provider is connected. Antigravity testing requires the supported `agy` CLI and an account signed in through that CLI.
  Steps to verify the app:
  1. Launch AI Gauge on a clean system: The initial setup guidance appears without errors or crash dialogs.
  2. Open Settings (gear icon): Test light/dark/system themes, warning/critical thresholds, window width adjustment, and the optional global hotkey (disabled by default).
  3. Test system tray integration: Confirm minimize to tray, restore from tray icon, and "Always on top" pinning.
  4. Add a Codex or Claude Code provider instance and click "Connect" to verify the official browser authentication flow. Claude's manual flow may require pasting the `CODE#STATE` value shown by the browser. If a local CLI session exists, verify that "Import" also works. For Antigravity, use a supported, pre-installed `agy` CLI.
  5. Reopen Settings and remove the connected provider instance to verify that its AI Gauge credential and card are removed.

  Network behavior:
  No provider network traffic is initiated until the user explicitly connects or checks a configured provider. Antigravity checks use the locally installed `agy` CLI.
