# `submission-sample.md` documents the Partner Center submission.
# See `submission-sample.yaml` for the complete submission schema and export structure.
# This file contains the overrides applied by the release workflow.

Listings:
  en-us:
    BaseListing:
      Features:
        - Automatic quota and reset-time monitoring
        - Multiple AI usage providers with visibility and ordering controls
        - Configurable background refresh intervals
        - Windows system tray access with light, dark, and system themes
        - Global hotkey toggle to show and hide the window
      ReleaseNotes: Global hotkey settings are now available. Choose a shortcut in Settings to show or hide AI Gauge from anywhere.

NotesForCertification: |
  AI Gauge is a lightweight Windows system tray utility that monitors quota usage and reset times for OpenAI Codex, Anthropic Claude Code, and Google Antigravity.

  [No test accounts or third-party CLI tools required]
  Steps to verify the app:
  1. Launch AI Gauge: The initial screen displays local readiness status, gracefully showing "Not installed" guidance on a clean system.
  2. Open Settings (gear icon): Test light/dark/system themes, warning/critical thresholds, window width adjustment, and the optional global hotkey (disabled by default).
  3. Test system tray integration: Confirm minimize to tray, restore from tray icon, and "Always on top" pinning.
  5. Click "Back to setup" to verify smooth navigation back to the initial setup screen.

  Network behavior:
  The setup screen runs only local system checks. No network traffic is initiated unless the user explicitly checks connection or enables a configured provider.
