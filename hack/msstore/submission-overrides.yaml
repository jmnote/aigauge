Listings:
  en-us:
    BaseListing:
      Description: AI Gauge is a lightweight Windows system tray widget for monitoring
        usage across OpenAI Codex, Anthropic Claude Code, and Google
        Antigravity. Connect Codex and Claude Code through their official browser
        login flows or import an existing local CLI session; Antigravity uses the
        locally installed and signed-in agy command-line tool. AI Gauge shows
        remaining quota percentages, reset times, connection status, and the last
        successful update in a compact desktop window. You can add multiple
        provider accounts, connect or import credentials, remove and reorder
        provider instances, configure refresh intervals and warning and critical
        thresholds, keep the widget above other windows, and choose a light, dark,
        or system theme. Optionally start with Windows with the window shown or
        in the system tray. AI Gauge runs locally, stores Codex and Claude OAuth
        tokens in its protected local credential store, and does not retain usage
        data on a remote server.
      Features:
        - Automatic quota and reset-time monitoring
        - Multiple provider accounts with ordering controls
        - Official browser sign-in and local credential import
        - Configurable background refresh intervals
        - Windows system tray access with light, dark, and system themes
        - Global hotkey toggle to show and hide the window
        - Optional Windows startup with the window shown or in the system tray
        - Independent warning and critical thresholds in 5% steps or disabled
      ReleaseNotes: Choose whether AI Gauge starts with Windows, shows its window,
        or starts in the system tray. Manual launches still show the window.
        Warning and critical thresholds now use dropdowns with 5% steps or Disabled.

NotesForCertification: |
  AI Gauge is a Windows tray widget for Codex, Claude Code and Antigravity usage.

  No test accounts are supplied. Provider accounts are needed only to test connection and live usage. Startup, themes, hotkeys, tray behavior, and the clean-install experience can be tested without an account. Antigravity requires a pre-installed, signed-in agy CLI.

  Steps to verify:
  1. Launch on a clean system and confirm setup guidance appears without errors.
  2. In Settings, test light/dark/system themes, the optional global hotkey (off by default), tray restore, and Always on top. Confirm thresholds offer Disabled or 5%-100% in 5% steps.
  3. Add Codex or Claude Code and use Connect for browser sign-in. Claude's manual flow may require CODE#STATE. If a local CLI session exists, verify Import. For Antigravity, use the installed agy CLI.
  4. Reopen Settings, remove the connected provider, and confirm its AI Gauge credential and card are removed.
  5. Confirm Start with Windows defaults to Off. Test Show window and Start in tray across sign-in, and confirm a manual Start-menu launch still shows the window. Disable the app in Windows Settings or Task Manager and verify enabling it reports the block and remains Off.

  On a clean install, providers are not queried before connection/check. Connected providers refresh automatically while running, including after sign-in when startup is enabled. Antigravity checks use agy.
