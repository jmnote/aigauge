NotesForCertification: >-
  AI Gauge is a lightweight Windows system tray utility that monitors quota
  usage and reset times for OpenAI Codex, Anthropic Claude Code, and Google
  Antigravity.


  No test accounts are supplied. Codex or Claude Code credentials are required
  only to exercise provider connection and live usage monitoring; the app
  remains functional on a clean device and shows setup guidance until a provider
  is connected. Antigravity testing requires the supported `agy` CLI and an
  account signed in through that CLI.

  Steps to verify the app:

  1. Launch AI Gauge on a clean system: The initial setup guidance appears
  without errors or crash dialogs.

  2. Open Settings (gear icon): Test light/dark/system themes, warning/critical
  thresholds, window width adjustment, and the optional global hotkey (disabled
  by default).

  3. Test system tray integration: Confirm minimize to tray, restore from tray
  icon, and "Always on top" pinning.

  4. Add a Codex or Claude Code provider instance and click "Connect" to verify
  the official browser authentication flow. Claude's manual flow may require
  pasting the `CODE#STATE` value shown by the browser. If a local CLI session
  exists, verify that "Import" also works. For Antigravity, use a supported,
  pre-installed `agy` CLI.

  5. Reopen Settings and remove the connected provider instance to verify that
  its AI Gauge credential and card are removed.


  Network behavior:

  No provider network traffic is initiated until the user explicitly connects or
  checks a configured provider. Antigravity checks use the locally installed
  `agy` CLI.
