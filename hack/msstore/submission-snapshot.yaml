      Description: AI Gauge is a lightweight Windows system tray widget for monitoring
        usage across OpenAI Codex, Anthropic Claude Code, and Google
        Antigravity. Connect Codex and Claude Code through their official
        browser login flows or import an existing local CLI session; Antigravity
        uses the locally installed and signed-in agy command-line tool. AI Gauge
        shows remaining quota percentages, reset times, connection status, and
        the last successful update in a compact desktop window. You can add
        multiple provider accounts, connect or import credentials, remove and
        reorder provider instances, configure refresh intervals and warning and
        critical thresholds, keep the widget above other windows, and choose a
        light, dark, or system theme. AI Gauge runs locally, stores Codex and
        Claude OAuth tokens in its protected local credential store, and does
        not retain usage data on a remote server.
      Features:
        - Automatic quota and reset-time monitoring
        - Multiple provider accounts with ordering controls
        - Official browser sign-in and local credential import
        - Configurable background refresh intervals
        - Windows system tray access with light, dark, and system themes
        - Global hotkey toggle to show and hide the window
