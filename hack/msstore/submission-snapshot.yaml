      Description: AI Gauge is a lightweight Windows system tray widget for monitoring
        usage across OpenAI Codex, Claude Code, GitHub Copilot, and Google
        Antigravity. Connect Codex, Claude Code, and GitHub Copilot through
        their official sign-in flows, or use the locally installed and signed-in
        agy CLI for Antigravity, to see remaining quota, reset times, and
        connection status at a glance. Add and reorder multiple accounts per
        provider, customize refresh intervals and warning and critical
        thresholds, choose a light, dark, or system theme, and keep the widget
        pinned above other windows or tucked away in the tray. AI Gauge runs
        entirely on your device and never stores usage data on a remote server.
      Features:
        - Automatic quota and reset-time monitoring, with Codex reset-credit
          visibility when available
        - Multiple provider accounts with reordering and distinguishing account
          details
        - Official browser sign-in, GitHub Copilot device flow, or local
          credential import
        - Configurable background refresh intervals
        - Windows system tray access with light, dark, and system themes
        - Global hotkey toggle to show and hide the window
        - Optional Windows startup with the window shown or in the system tray
        - Independent warning and critical thresholds in 5% steps or disabled
      ReleaseNotes: Added GitHub Copilot support - connect via GitHub's OAuth device
        flow and monitor your premium request quota alongside Codex, Claude, and
        Antigravity. Long account labels in Settings now truncate with a hover
        tooltip instead of overflowing action buttons.
