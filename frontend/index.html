<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Gauge</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="shell">
    <div class="titlebar">
      <div class="brand">
        <img class="app-logo" src="/logo.svg" alt="AI Gauge" draggable="false" />
        <span class="brand-name">AI Gauge</span>
      </div>
      <div class="actions">
        <span class="window-buttons">
          <button id="pin-window" class="pin-btn" title="Always on top" aria-label="Always on top" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
              <path
                d="M4.146.146A.5.5 0 0 1 4.5 0h7a.5.5 0 0 1 .5.5c0 .68-.342 1.174-.646 1.479-.283.282-.63.53-1.004.743v3.593a2.5 2.5 0 0 1 .52 1.344l.43 3.44A.5.5 0 0 1 10.8 11.2H8.5v4.3a.5.5 0 0 1-1 0V11.2H5.2a.5.5 0 0 1-.5-.544l.43-3.44a2.5 2.5 0 0 1 .52-1.344V2.222c-.374-.213-.721-.461-1.004-.743C4.342 1.174 4 0.68 4 .5a.5.5 0 0 1 .146-.354z" />
            </svg>
          </button>
          <button id="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
          </button>
          <button id="hide-window" title="Hide to system tray" aria-label="Hide to system tray">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </span>
      </div>
    </div>
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-titlebar">
        <div class="settings-brand">
          <svg class="settings-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          <span id="settings-title" class="settings-title">Settings</span>
        </div>
        <button class="dialog-close" type="button" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form method="dialog" class="settings-form">
        <div id="provider-list" class="provider-options"></div>
        <div class="threshold-settings">
          <label class="threshold-setting"><span class="threshold-label"><span
                class="threshold-dot warning"></span>Warning</span><span class="threshold-value"><input
                id="warning-threshold" type="number" min="1" max="100" step="1" /><span>%</span></span></label>
          <label class="threshold-setting"><span class="threshold-label"><span
                class="threshold-dot critical"></span>Critical</span><span class="threshold-value"><input
                id="critical-threshold" type="number" min="0" max="99" step="1" /><span>%</span></span></label>
        </div>
        <div class="refresh-setting-row">
          <span class="refresh-label">Refresh</span>
          <select id="refresh-preset-select">
            <option value="10">10s</option>
            <option value="30">30s</option>
            <option value="60">1m</option>
            <option value="120">2m</option>
            <option value="180">3m</option>
            <option value="300">5m</option>
            <option value="600">10m</option>
            <option value="1800">30m</option>
            <option value="custom">Custom</option>
          </select>
          <span class="threshold-input-wrap"><input id="refresh-interval-input" type="number" min="1" max="3600"
              step="1" /><span>s</span></span>
        </div>
        <div class="theme-setting-row">
          <span class="theme-label">Theme</span>
          <span class="theme-button-group" role="group" aria-label="Theme">
            <button type="button" class="theme-option-btn" data-theme="light">Light</button>
            <button type="button" class="theme-option-btn" data-theme="dark">Dark</button>
            <button type="button" class="theme-option-btn" data-theme="system">System</button>
          </span>
        </div>
        <div class="settings-version">
          <span>AI Gauge</span> <span id="version">v—</span>
        </div>
      </form>
    </dialog>
    <div id="no-providers" class="no-providers" style="display: none;">
      <p>No providers enabled</p>
      <button id="open-settings-btn" class="open-settings-btn">Open Settings</button>
    </div>
    <div class="usage-sections">
      <section id="codex-card" class="usage-card">
        <div class="heading">
          <strong>Codex</strong>
          <span class="status-area"><span class="status-wrap" tabindex="0"
              aria-label="Codex connection status"><span id="codex-dot" class="status-dot"></span><span
                id="codex-tooltip" class="status-tooltip"></span></span><button type="button"
              class="provider-refresh-btn" data-provider-id="codex" title="Refresh Codex now"
              aria-label="Refresh Codex now">⟳</button></span>
        </div>
        <div id="codex-groups">
          <div id="codex-loading" class="plan loading-text">Loading usage...</div>
        </div>
        <div id="codex-error" class="provider-error" role="status" hidden></div>
      </section>
      <section id="claude-card" class="usage-card">
        <div class="heading">
          <strong>Claude</strong>
          <span class="status-area"><span class="status-wrap" tabindex="0"
              aria-label="Claude connection status"><span id="claude-dot" class="status-dot"></span><span
                id="claude-tooltip" class="status-tooltip"></span></span><button type="button"
              class="provider-refresh-btn" data-provider-id="claude" title="Refresh Claude now"
              aria-label="Refresh Claude now">⟳</button></span>
        </div>
        <div id="claude-groups">
          <div id="claude-loading" class="plan loading-text">Loading usage...</div>
        </div>
        <div id="claude-error" class="provider-error" role="status" hidden></div>
      </section>
      <section id="agy-card" class="usage-card">
        <div class="heading">
          <strong>Antigravity</strong>
          <span class="status-area"><span class="status-wrap" tabindex="0"
              aria-label="Antigravity connection status"><span id="agy-dot" class="status-dot"></span><span
                id="agy-tooltip" class="status-tooltip"></span></span><button type="button"
              class="provider-refresh-btn" data-provider-id="antigravity" title="Refresh Antigravity now"
              aria-label="Refresh Antigravity now">⟳</button></span>
        </div>
        <div id="agy-groups">
          <div id="agy-loading" class="plan loading-text">Loading usage...</div>
        </div>
        <div id="agy-error" class="provider-error" role="status" hidden></div>
      </section>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>

</html>
