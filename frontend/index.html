<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Gauge</title>
  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="stylesheet" href="/styles/icon.css" />
</head>

<body>
  <main class="shell">
    <div id="window-size-indicator" class="window-size-indicator" aria-hidden="true"></div>
    <div class="titlebar">
      <div class="brand">
        <img class="app-logo" src="/images/logo.svg" alt="AI Gauge" draggable="false" />
        <span class="brand-name">AI Gauge</span>
      </div>
      <div class="actions">
        <span class="window-buttons">
          <button id="pin-window" class="pin-btn" title="Always on top" aria-label="Always on top" aria-pressed="false">
            <span class="icon icon-pin" aria-hidden="true"></span>
          </button>
          <button id="settings-btn" title="Settings" aria-label="Settings">
              <span class="icon icon-cog" aria-hidden="true"></span>
            </button>
          <button id="hide-window" title="Hide to system tray" aria-label="Hide to system tray">
            <span class="icon icon-close" aria-hidden="true"></span>
          </button>
        </span>
      </div>
    </div>
    <section id="setup-screen" class="setup-screen" hidden>
      <p class="setup-intro">No providers added yet. Click the <span class="icon icon-cog setup-inline-icon" aria-label="Settings"></span> in the upper-right corner to add one.</p>
    </section>
    <div class="usage-sections">
      <!-- One .usage-card per provider instance, built and kept in sync with
           config.providers by app.js (see buildProviderCard/syncProviderCards) -
           there is no fixed set of providers to hard-code here any more. -->
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>

</html>
