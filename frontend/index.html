<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Gauge</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="shell">
    <div class="titlebar">
      <div class="brand">
        <img class="app-logo" src="/logo.svg" alt="AI Gauge" draggable="false" />
        <span class="brand-name">AI Gauge</span>
        <span id="version" class="brand-version">v—</span>
      </div>
      <div class="actions">
        <span class="window-buttons">
          <button id="pin-window" class="pin-btn" title="Always on top" aria-label="Always on top" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
              <path d="M4.146.146A.5.5 0 0 1 4.5 0h7a.5.5 0 0 1 .5.5c0 .68-.342 1.174-.646 1.479-.283.282-.63.53-1.004.743v3.593a2.5 2.5 0 0 1 .52 1.344l.43 3.44A.5.5 0 0 1 10.8 11.2H8.5v4.3a.5.5 0 0 1-1 0V11.2H5.2a.5.5 0 0 1-.5-.544l.43-3.44a2.5 2.5 0 0 1 .52-1.344V2.222c-.374-.213-.721-.461-1.004-.743C4.342 1.174 4 0.68 4 .5a.5.5 0 0 1 .146-.354z"/>
            </svg>
          </button>
          <button id="settings" title="Settings" aria-label="Settings">⚙</button>
          <button id="hide-window" title="Hide to system tray" aria-label="Hide to system tray">×</button>
        </span>
      </div>
    </div>
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-form">
        <div class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button class="dialog-close" type="button" title="Close" aria-label="Close">×</button>
        </div>
        <fieldset>
          <legend>Theme</legend>
          <div class="theme-options">
            <label><input type="radio" name="theme" value="light" /> Light</label>
            <label><input type="radio" name="theme" value="dark" /> Dark</label>
            <label><input type="radio" name="theme" value="system" /> System</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Providers</legend>
          <div class="provider-options">
            <label class="provider-setting"><input type="checkbox" id="provider-codex" /> Codex</label>
            <label class="provider-setting"><input type="checkbox" id="provider-antigravity" /> Antigravity</label>
          </div>
        </fieldset>
        <fieldset class="threshold-settings">
          <legend>Thresholds</legend>
          <label class="threshold-setting"><span class="threshold-label"><span
                class="threshold-dot warning"></span>Warning</span><span class="threshold-value"><input
                id="warning-threshold" type="number" min="1" max="100" step="1" /><span>%</span></span></label>
          <label class="threshold-setting"><span class="threshold-label"><span
                class="threshold-dot critical"></span>Critical</span><span class="threshold-value"><input
                id="critical-threshold" type="number" min="0" max="99" step="1" /><span>%</span></span></label>
        </fieldset>
        <div class="refresh-setting-row">
          <span class="refresh-label">Refresh</span>
          <select id="refresh-preset-select">
            <option value="10">10s</option>
            <option value="30">30s</option>
            <option value="60">1m</option>
            <option value="120">2m</option>
            <option value="180">3m</option>
            <option value="300">5m</option>
            <option value="600">10m</option>
            <option value="1800">30m</option>
            <option value="custom">Custom</option>
          </select>
          <span class="threshold-input-wrap"><input
              id="refresh-interval-input" type="number" min="1" max="3600" step="1" /><span>s</span></span>
        </div>
      </form>
    </dialog>
    <div id="no-providers" class="no-providers" style="display: none;">
      <p>No providers enabled</p>
      <button id="open-settings-btn" class="open-settings-btn">Open Settings</button>
    </div>
    <section id="codex-card" class="usage-card">
      <div class="heading">
        <strong>Codex</strong>
        <span class="card-status"><span id="plan" class="plan"></span><span class="status-wrap" tabindex="0"
            aria-label="Codex connection status"><span id="codex-dot"
              class="status-dot"></span><span id="codex-tooltip" class="status-tooltip"></span></span></span>
      </div>
      <div class="limit">
        <div class="limit-label"><span>5h</span><span id="five-hour-reset" class="inline-reset"></span><span
            id="five-hour-value" class="limit-value loading-text">-</span></div>
        <div class="bar">
          <div id="five-hour-bar" class="fill" style="width: 0%"></div>
        </div>
      </div>
      <div class="limit">
        <div class="limit-label"><span>7d</span><span id="seven-day-reset" class="inline-reset"></span><span
            id="seven-day-value" class="limit-value loading-text">-</span></div>
        <div class="bar">
          <div id="seven-day-bar" class="fill" style="width: 0%"></div>
        </div>
      </div>
      <div id="codex-error" class="provider-error" role="status" hidden></div>
    </section>
    <section id="agy-card" class="usage-card">
      <div class="heading">
        <strong>Antigravity</strong>
        <span class="card-status"><span id="agy-plan" class="plan"></span><span class="status-wrap" tabindex="0"
            aria-label="Antigravity connection status"><span id="agy-dot"
              class="status-dot"></span><span id="agy-tooltip" class="status-tooltip"></span></span></span>
      </div>
      <div id="agy-groups">
        <div id="agy-loading" class="plan loading-text">Loading usage...</div>
      </div>
      <div id="agy-error" class="provider-error" role="status" hidden></div>
    </section>
  </main>
  <script type="module">
    const wails = await import('/wails/runtime.js');
    if (globalThis.__AIGAUGE_LIVE__) {
      const watchLiveResource = url => {
        let snapshot = '';
        setInterval(async () => {
          const response = await fetch(url, { cache: 'no-store' });
          const current = await response.text();
          if (snapshot && current !== snapshot) location.reload();
          snapshot = current;
        }, 1000);
      };
      watchLiveResource('/__live-version');
    }

    const validThemes = new Set(['light', 'dark', 'system']);
    const settingsStorageKey = 'aigauge-settings-v1';

    function parseIntervalToSeconds(val) {
      if (typeof val === 'number') {
        return Number.isFinite(val) ? Math.max(1, Math.min(3600, Math.round(val))) : 120;
      }
      if (typeof val === 'string') {
        const str = val.trim().toLowerCase();
        let total = 0;
        let matched = false;
        const mMatch = str.match(/(\d+)\s*m/);
        const sMatch = str.match(/(\d+)\s*s/);
        if (mMatch) { total += parseInt(mMatch[1], 10) * 60; matched = true; }
        if (sMatch) { total += parseInt(sMatch[1], 10); matched = true; }
        if (matched) return Math.max(1, Math.min(3600, total));
        const rawNum = parseInt(str, 10);
        if (Number.isFinite(rawNum)) return Math.max(1, Math.min(3600, rawNum));
      }
      return 120;
    }

    function saveCurrentConfig() {
      try {
        localStorage.setItem(settingsStorageKey, JSON.stringify(config));
      } catch (e) {
        console.warn('Failed to save settings:', e);
      }
    }

    const defaultConfig = {
      providers: {
        codex: { enabled: true },
        antigravity: { enabled: true }
      },
      theme: 'system',
      refreshInterval: 120,
      thresholds: {
        warning: 50,
        critical: 20
      }
    };

    function normalizeConfig(value) {
      const warningValue = Number(value?.thresholds?.warning);
      const criticalValue = Number(value?.thresholds?.critical);
      const warning = Number.isFinite(warningValue) && warningValue >= 1 && warningValue <= 100
        ? warningValue : defaultConfig.thresholds.warning;
      let critical = Number.isFinite(criticalValue) && criticalValue >= 0 && criticalValue <= 99
        ? criticalValue : defaultConfig.thresholds.critical;
      if (critical >= warning) critical = Math.max(0, warning - 1);

      const theme = value?.theme === 'auto' ? 'system' : value?.theme;
      return {
        providers: {
          codex: { enabled: value?.providers?.codex?.enabled !== false },
          antigravity: { enabled: value?.providers?.antigravity?.enabled !== false }
        },
        theme: validThemes.has(theme) ? theme : defaultConfig.theme,
        refreshInterval: parseIntervalToSeconds(value?.refreshInterval),
        thresholds: { warning, critical }
      };
    }

    let config = normalizeConfig(defaultConfig);

    try {
      const storedSettings = localStorage.getItem(settingsStorageKey);
      if (storedSettings !== null) {
        config = normalizeConfig(JSON.parse(storedSettings));
      } else {
        const legacyTheme = localStorage.getItem('aigauge-theme');
        const legacyInterval = localStorage.getItem('aigauge-refresh-interval');
        const legacyWarning = localStorage.getItem('aigauge-warning-threshold');
        const legacyCritical = localStorage.getItem('aigauge-critical-threshold');

        let migrated = false;
        if (legacyTheme && ['light', 'dark', 'system', 'auto'].includes(legacyTheme)) {
          config.theme = legacyTheme === 'auto' ? 'system' : legacyTheme;
          migrated = true;
        }
        if (legacyInterval) {
          config.refreshInterval = parseIntervalToSeconds(legacyInterval);
          migrated = true;
        }
        if (legacyWarning !== null) {
          const parsedWarning = Number(legacyWarning);
          if (Number.isFinite(parsedWarning)) {
            config.thresholds.warning = Math.max(1, Math.min(100, parsedWarning));
            migrated = true;
          }
        }
        if (legacyCritical !== null) {
          const parsedCritical = Number(legacyCritical);
          if (Number.isFinite(parsedCritical)) {
            config.thresholds.critical = Math.max(0, Math.min(99, parsedCritical));
            migrated = true;
          }
        }
        if (config.thresholds.critical >= config.thresholds.warning) {
          config.thresholds.critical = Math.max(0, config.thresholds.warning - 1);
        }
        if (migrated) {
          config = normalizeConfig(config);
          saveCurrentConfig();
        }
      }
    } catch (e) {
      console.warn('Failed to load or migrate settings:', e);
      config = normalizeConfig(defaultConfig);
    }

    let warningThreshold = config.thresholds.warning;
    let criticalThreshold = config.thresholds.critical;

    function applyLimitState(barElement, remaining) {
      const state = remaining <= criticalThreshold ? 'critical'
        : remaining <= warningThreshold ? 'warning' : '';
      barElement.classList.remove('warning', 'critical');
      if (state) barElement.classList.add(state);
    }

    function refreshLimitStates() {
      document.querySelectorAll('.fill[data-remaining]').forEach(bar => {
        applyLimitState(bar, Number(bar.dataset.remaining));
      });
    }

    const formatTimeRemaining = (seconds, targetDate) => {
      if (!seconds || seconds <= 0 || !targetDate || Number.isNaN(targetDate.getTime())) return '';
      const now = new Date();
      const sameDay = targetDate.getFullYear() === now.getFullYear()
        && targetDate.getMonth() === now.getMonth()
        && targetDate.getDate() === now.getDate();
      const date = [targetDate.getMonth() + 1, targetDate.getDate()]
        .map(value => String(value).padStart(2, '0'))
        .join('-');
      const time = targetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      let days = Math.floor(seconds / 86400);
      let hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (days > 0 && minutes >= 30) {
        hours += 1;
        if (hours === 24) {
          days += 1;
          hours = 0;
        }
      }
      const duration = days > 0
        ? `${days}d${hours ? `${hours}h` : ''}`
        : (hours || minutes ? `${hours ? `${hours}h` : ''}${minutes ? `${minutes}m` : ''}` : '<1m');
      return `${duration} (${sameDay ? time : `${date} ${time}`})`;
    };

    const formatReset = seconds => {
      if (!seconds || seconds <= 0) return '';
      return formatTimeRemaining(seconds, new Date(Date.now() + seconds * 1000));
    };

    const formatResetAt = resetTime => {
      if (!resetTime) return '';
      const targetDate = new Date(resetTime);
      if (Number.isNaN(targetDate.getTime())) return '';
      const seconds = Math.max(0, Math.round((targetDate.getTime() - Date.now()) / 1000));
      return formatTimeRemaining(seconds, targetDate);
    };

    let refreshInterval = parseIntervalToSeconds(config.refreshInterval);
    let codexNextRefreshAt = Date.now() + refreshInterval * 1000;
    let antigravityNextRefreshAt = Date.now() + refreshInterval * 1000;
    let codexTimerId = null;
    let antigravityTimerId = null;
    let codexFailureCount = 0;
    let antigravityFailureCount = 0;
    let codexLastSuccessAt = 0;
    let antigravityLastSuccessAt = 0;
    let codexLastError = '';
    let antigravityLastError = '';

    function updateStatus(dotId, tooltipId, failureCount, lastSuccessAt, nextRefreshAt, lastError) {
      const dot = document.getElementById(dotId);
      dot.classList.remove('connected', 'warning');
      if (lastSuccessAt && failureCount < 3) dot.classList.add('connected');
      else if (lastSuccessAt && failureCount < 6) dot.classList.add('warning');

      const tooltip = document.getElementById(tooltipId);
      const successValue = lastSuccessAt ? formatAgo(lastSuccessAt) : 'None';
      const nextRefreshText = formatUntil(nextRefreshAt);
      tooltip.replaceChildren(
        createTooltipRow('Fails', `${failureCount}`),
        createTooltipRow('Last fetch', successValue),
        ...(lastError ? [createTooltipRow('Last error', lastError)] : []),
        createTooltipRow('Next fetch', nextRefreshText),
      );
    }

    function createTooltipRow(labelText, valueText) {
      const row = document.createElement('div');
      row.className = 'status-tooltip-row';
      const label = document.createElement('span');
      label.className = 'status-tooltip-label';
      label.textContent = labelText;
      const value = document.createElement('span');
      value.textContent = valueText;
      row.append(label, value);
      return row;
    }

    function formatAgo(timestamp) {
      const elapsed = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
      return `${elapsed}s ago`;
    }

    function formatUntil(timestamp) {
      const seconds = Math.max(0, Math.ceil((timestamp - Date.now()) / 1000));
      return `in ${seconds}s`;
    }

    function retryDelay(failureCount) {
      return Math.min(refreshInterval * (2 ** Math.min(failureCount, 4)), 1800);
    }

    function scheduleCodex() {
      clearTimeout(codexTimerId);
      if (!config.providers.codex.enabled) return;
      const delay = retryDelay(codexFailureCount);
      codexNextRefreshAt = Date.now() + delay * 1000;
      codexTimerId = setTimeout(fetchCodex, delay * 1000);
    }

    function scheduleAntigravity() {
      clearTimeout(antigravityTimerId);
      if (!config.providers.antigravity.enabled) return;
      const delay = retryDelay(antigravityFailureCount);
      antigravityNextRefreshAt = Date.now() + delay * 1000;
      antigravityTimerId = setTimeout(fetchAntigravity, delay * 1000);
    }

    function setLoading(dotId, loading) {
      document.getElementById(dotId).classList.toggle('loading', loading);
    }

    function clearLoadingText(cardId) {
      document.querySelectorAll(`#${cardId} .loading-text`).forEach(element => element.classList.remove('loading-text'));
    }

    function showProviderError(providerId, message) {
      const element = document.getElementById(`${providerId}-error`);
      element.textContent = message;
      element.hidden = !message;
    }

    function renderUsage(usage, failureCount) {
      if (usage.error) {
        showProviderError('codex', usage.error);
        updateStatus('codex-dot', 'codex-tooltip', failureCount, codexLastSuccessAt, codexNextRefreshAt, codexLastError);
        requestWindowResize();
        return;
      }
      showProviderError('codex', '');
      const fiveHourRemaining = Math.max(0, Math.min(100, 100 - usage.fiveHour));
      const sevenDayRemaining = Math.max(0, Math.min(100, 100 - usage.sevenDay));
      document.getElementById('plan').textContent = usage.plan || 'Codex';
      updateStatus('codex-dot', 'codex-tooltip', failureCount, codexLastSuccessAt, codexNextRefreshAt, codexLastError);
      document.getElementById('five-hour-value').textContent = `${fiveHourRemaining.toFixed(0)}%`;
      document.getElementById('seven-day-value').textContent = `${sevenDayRemaining.toFixed(0)}%`;
      document.getElementById('five-hour-bar').style.width = `${fiveHourRemaining}%`;
      document.getElementById('seven-day-bar').style.width = `${sevenDayRemaining}%`;
      document.getElementById('five-hour-bar').dataset.remaining = fiveHourRemaining;
      document.getElementById('seven-day-bar').dataset.remaining = sevenDayRemaining;
      applyLimitState(document.getElementById('five-hour-bar'), fiveHourRemaining);
      applyLimitState(document.getElementById('seven-day-bar'), sevenDayRemaining);
      document.getElementById('five-hour-reset').textContent = formatReset(usage.fiveHourResetIn);
      document.getElementById('seven-day-reset').textContent = formatReset(usage.sevenDayResetIn);
      requestWindowResize();
    }

    function renderAntigravity(usage, failureCount) {
      const groups = document.getElementById('agy-groups');
      if (usage.error) {
        groups.replaceChildren();
        showProviderError('agy', usage.error);
        updateStatus('agy-dot', 'agy-tooltip', failureCount, antigravityLastSuccessAt, antigravityNextRefreshAt, antigravityLastError);
        requestWindowResize();
        return;
      }
      showProviderError('agy', '');
      updateStatus('agy-dot', 'agy-tooltip', failureCount, antigravityLastSuccessAt, antigravityNextRefreshAt, antigravityLastError);
      document.getElementById('agy-plan').textContent = 'agy';
      groups.replaceChildren();
      if (!usage.groups?.length) {
        requestWindowResize();
        return;
      }
      for (const group of usage.groups) {
        const groupElement = document.createElement('div');
        groupElement.className = 'agy-group';
        const title = document.createElement('div');
        title.className = 'agy-group-title';
        title.textContent = group.name;
        groupElement.append(title);
        const buckets = [...(group.buckets || [])].sort((a, b) => {
          const order = { '5h': 0, weekly: 1 };
          return (order[a.window] ?? 2) - (order[b.window] ?? 2);
        });
        for (const bucket of buckets) {
          const limit = document.createElement('div');
          limit.className = 'limit';
          const label = document.createElement('div');
          label.className = 'limit-label';
          const name = document.createElement('span');
          name.textContent = bucket.window === '5h' ? '5h' : bucket.window === 'weekly' ? '7d' : bucket.name;
          const value = document.createElement('span');
          value.className = 'limit-value';
          const remaining = Math.max(0, Math.min(100, bucket.remaining));
          value.textContent = `${Math.round(remaining)}%`;
          label.append(name, value);
          const bar = document.createElement('div');
          bar.className = 'bar';
          const fill = document.createElement('div');
          fill.className = 'fill';
          fill.style.width = `${remaining}%`;
          fill.dataset.remaining = remaining;
          applyLimitState(fill, remaining);
          bar.append(fill);
          const reset = document.createElement('span');
          reset.className = 'inline-reset';
          reset.textContent = formatResetAt(bucket.resetTime);
          label.insertBefore(reset, value);
          limit.append(label, bar);
          groupElement.append(limit);
        }
        groups.append(groupElement);
      }
      requestWindowResize();
    }

    async function fetchCodex() {
      if (!config.providers.codex.enabled) return;
      setLoading('codex-dot', true);
      try {
        const usage = await wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.GetCodexUsage');
        clearLoadingText('codex-card');
        if (usage.error) {
          codexFailureCount += 1;
          codexLastError = String(usage.error).slice(0, 120);
        } else {
          codexFailureCount = 0;
          codexLastSuccessAt = Date.now();
          codexLastError = '';
        }
        renderUsage(usage, codexFailureCount);
      } catch (error) {
        clearLoadingText('codex-card');
        codexFailureCount += 1;
        codexLastError = `Frontend call failed: ${error}`.slice(0, 120);
        renderUsage({ error: codexLastError }, codexFailureCount);
      } finally {
        setLoading('codex-dot', false);
        scheduleCodex();
      }
    }

    async function fetchAntigravity() {
      if (!config.providers.antigravity.enabled) return;
      setLoading('agy-dot', true);
      try {
        const usage = await wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.GetAntigravityUsage');
        clearLoadingText('agy-card');
        if (usage.error) {
          antigravityFailureCount += 1;
          antigravityLastError = String(usage.error).slice(0, 120);
        } else {
          antigravityFailureCount = 0;
          antigravityLastSuccessAt = Date.now();
          antigravityLastError = '';
        }
        renderAntigravity(usage, antigravityFailureCount);
      } catch (error) {
        clearLoadingText('agy-card');
        antigravityFailureCount += 1;
        antigravityLastError = `Frontend call failed: ${error}`.slice(0, 120);
        renderAntigravity({ error: antigravityLastError }, antigravityFailureCount);
      } finally {
        setLoading('agy-dot', false);
        scheduleAntigravity();
      }
    }

    const settingsDialog = document.getElementById('settings-dialog');
    const providerCodexInput = document.getElementById('provider-codex');
    const providerAntigravityInput = document.getElementById('provider-antigravity');
    const themeInputs = [...document.querySelectorAll('input[name="theme"]')];
    const pinWindowBtn = document.getElementById('pin-window');
    const refreshPresetSelect = document.getElementById('refresh-preset-select');
    const refreshIntervalInput = document.getElementById('refresh-interval-input');
    const warningThresholdInput = document.getElementById('warning-threshold');
    const criticalThresholdInput = document.getElementById('critical-threshold');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');

    let isAlwaysOnTop = false;

    function updateAlwaysOnTopUI(isTop) {
      pinWindowBtn.classList.toggle('active', isTop);
      pinWindowBtn.title = isTop ? 'Always on top (Enabled)' : 'Always on top (Disabled)';
      pinWindowBtn.setAttribute('aria-pressed', isTop ? 'true' : 'false');
    }

    function toggleAlwaysOnTop() {
      isAlwaysOnTop = !isAlwaysOnTop;
      updateAlwaysOnTopUI(isAlwaysOnTop);
      wails.Window.SetAlwaysOnTop(isAlwaysOnTop);
      wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.SetAlwaysOnTop', isAlwaysOnTop).catch(() => {});
    }

    pinWindowBtn.addEventListener('click', toggleAlwaysOnTop);
    updateAlwaysOnTopUI(isAlwaysOnTop);

    function updateProvidersVisibility() {
      const codexEnabled = config.providers?.codex?.enabled !== false;
      const agyEnabled = config.providers?.antigravity?.enabled !== false;
      const codexCard = document.getElementById('codex-card');
      const agyCard = document.getElementById('agy-card');
      const noProviders = document.getElementById('no-providers');

      codexCard.style.display = codexEnabled ? '' : 'none';
      agyCard.style.display = agyEnabled ? '' : 'none';
      noProviders.style.display = (!codexEnabled && !agyEnabled) ? 'flex' : 'none';

      const visibleCards = [codexCard, agyCard].filter(card => card.style.display !== 'none');
      visibleCards.forEach((card, index) => {
        card.classList.toggle('card-divider', index > 0);
      });

      if (codexEnabled) {
        if (!codexTimerId) fetchCodex();
      } else {
        clearTimeout(codexTimerId);
        codexTimerId = null;
      }

      if (agyEnabled) {
        if (!antigravityTimerId) fetchAntigravity();
      } else {
        clearTimeout(antigravityTimerId);
        antigravityTimerId = null;
      }

      requestWindowResize();
    }

    function applyTheme(theme, persist = true) {
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.resolvedTheme = theme === 'system'
        ? (systemTheme.matches ? 'dark' : 'light')
        : theme;
      if (persist) {
        config.theme = theme;
        saveCurrentConfig();
      }
    }

    let forcedTheme = '';
    try {
      forcedTheme = await wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.GetThemeOverride');
    } catch (error) {
      console.warn('Unable to read the theme override:', error);
    }
    const activeTheme = forcedTheme || config.theme || 'system';
    applyTheme(validThemes.has(activeTheme) ? activeTheme : 'system', !forcedTheme);

    themeInputs.forEach(input => {
      input.addEventListener('change', () => applyTheme(input.value));
    });

    systemTheme.addEventListener('change', () => {
      if (document.documentElement.dataset.theme === 'system') applyTheme('system', false);
    });

    providerCodexInput.addEventListener('change', () => {
      config.providers.codex.enabled = providerCodexInput.checked;
      updateProvidersVisibility();
      saveCurrentConfig();
    });

    providerAntigravityInput.addEventListener('change', () => {
      config.providers.antigravity.enabled = providerAntigravityInput.checked;
      updateProvidersVisibility();
      saveCurrentConfig();
    });

    function updateRefreshPresetSelect(seconds) {
      const matchingOption = refreshPresetSelect.querySelector(`option[value="${seconds}"]`);
      refreshPresetSelect.value = matchingOption ? String(seconds) : 'custom';
    }

    function setRefreshInterval(val) {
      let seconds = Number(val);
      seconds = Number.isFinite(seconds) ? Math.max(1, Math.min(3600, Math.round(seconds))) : 120;
      refreshInterval = seconds;
      config.refreshInterval = refreshInterval;
      refreshIntervalInput.value = refreshInterval;
      updateRefreshPresetSelect(refreshInterval);
      saveCurrentConfig();
      scheduleCodex();
      scheduleAntigravity();
    }

    function openSettings() {
      const currentTheme = forcedTheme || config.theme || 'system';
      themeInputs.forEach(input => { input.checked = input.value === currentTheme; });
      providerCodexInput.checked = config.providers.codex.enabled;
      providerAntigravityInput.checked = config.providers.antigravity.enabled;
      refreshIntervalInput.value = refreshInterval;
      updateRefreshPresetSelect(refreshInterval);
      warningThresholdInput.value = warningThreshold;
      criticalThresholdInput.value = criticalThreshold;
      settingsDialog.showModal();
      requestWindowResize();
    }

    document.getElementById('settings').addEventListener('click', openSettings);
    document.getElementById('open-settings-btn').addEventListener('click', openSettings);

    document.querySelectorAll('.dialog-close').forEach(button => {
      button.addEventListener('click', () => button.closest('dialog').close('cancel'));
    });

    settingsDialog.addEventListener('click', event => {
      if (event.target === settingsDialog) settingsDialog.close();
    });
    settingsDialog.addEventListener('close', () => requestWindowResize());

    document.getElementById('hide-window').addEventListener('click', () => {
      wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.HideToTray').catch(() => wails.Window.Hide());
    });

    function saveThresholds() {
      if (warningThresholdInput.value === '' || criticalThresholdInput.value === '') return;
      const warningValue = Number(warningThresholdInput.value);
      const criticalValue = Number(criticalThresholdInput.value);
      if (!Number.isFinite(warningValue) || !Number.isFinite(criticalValue)) return;
      warningThreshold = Math.max(1, Math.min(100, warningValue));
      criticalThreshold = Math.max(0, Math.min(99, criticalValue));
      if (criticalThreshold >= warningThreshold) {
        criticalThreshold = Math.max(0, warningThreshold - 1);
      }
      warningThresholdInput.value = warningThreshold;
      criticalThresholdInput.value = criticalThreshold;
      config.thresholds.warning = warningThreshold;
      config.thresholds.critical = criticalThreshold;
      saveCurrentConfig();
      refreshLimitStates();
    }

    warningThresholdInput.addEventListener('change', saveThresholds);
    criticalThresholdInput.addEventListener('change', saveThresholds);

    refreshPresetSelect.addEventListener('change', () => {
      if (refreshPresetSelect.value === 'custom') {
        refreshIntervalInput.focus();
        refreshIntervalInput.select();
        return;
      }
      setRefreshInterval(Number(refreshPresetSelect.value));
    });

    refreshIntervalInput.addEventListener('change', () => setRefreshInterval(refreshIntervalInput.value));

    wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.GetVersion').then(version => {
      document.getElementById('version').textContent = version || 'v—';
    });

    let lastReportedHeight = 0;
    let resizeTimer = null;
    function requestWindowResize() {
      if (resizeTimer) cancelAnimationFrame(resizeTimer);
      resizeTimer = requestAnimationFrame(() => {
        const shell = document.querySelector('.shell');
        if (!shell) return;
        let height = Math.ceil(shell.scrollHeight);
        if (settingsDialog?.open) {
          const form = settingsDialog.querySelector('.settings-form') || settingsDialog;
          const formHeight = form.scrollHeight || form.offsetHeight;
          const dialogHeight = Math.ceil(formHeight) + 32;
          if (dialogHeight > height) height = dialogHeight;
        }
        if (height > 0 && Math.abs(height - lastReportedHeight) >= 2) {
          lastReportedHeight = height;
          wails.Call.ByName('github.com/jmnote/aigauge/internal/app.App.SetContentHeight', height).catch(() => {});
        }
      });
    }

    const resizeObserver = new ResizeObserver(() => {
      requestWindowResize();
    });
    resizeObserver.observe(document.querySelector('.shell'));

    updateProvidersVisibility();
    requestWindowResize();

    function refreshStatusTooltips() {
      if (config.providers.codex.enabled) {
        updateStatus('codex-dot', 'codex-tooltip', codexFailureCount, codexLastSuccessAt, codexNextRefreshAt, codexLastError);
      }
      if (config.providers.antigravity.enabled) {
        updateStatus('agy-dot', 'agy-tooltip', antigravityFailureCount, antigravityLastSuccessAt, antigravityNextRefreshAt, antigravityLastError);
      }
    }

    document.querySelectorAll('.status-wrap').forEach(element => {
      element.addEventListener('mouseenter', refreshStatusTooltips);
      element.addEventListener('focus', refreshStatusTooltips);
    });

    setInterval(() => {
      if (document.visibilityState === 'visible' && document.querySelector('.status-wrap:hover, .status-wrap:focus')) {
        refreshStatusTooltips();
      }
    }, 1000);
  </script>
</body>

</html>
