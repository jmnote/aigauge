  <g filter="url(#softShadow)">
    <!-- Seven regular slots around the dial; the two bottom slots are intentionally open.
         Each segment is a rounded ring wedge between outer radius 420 and inner radius 210
         (thickened from the original 255 for a heavier, bolder mark), corner radius 26,
         centered on (512,512), generated rather than hand-drawn. -->
    <path d="M 151.3,727.1 A 420,420 0 0 1 93.7,474.7 Q 96.8,448.9 122.5,452.8 L 278.7,476.5 Q 304.4,480.4 302.1,506.3 A 210,210 0 0 0 325.3,608.2 Q 338.6,630.5 317.2,645.2 L 186.7,734.4 Q 165.3,749.0 151.3,727.1 Z" fill="url(#seg1)"/>
    <path d="M 118.9,364.1 A 420,420 0 0 1 280.3,161.7 Q 302.4,148.0 315.4,170.5 L 394.2,307.5 Q 407.2,330.0 385.5,344.3 A 210,210 0 0 0 320.4,426.0 Q 311.3,450.4 286.4,442.7 L 135.4,396.3 Q 110.5,388.7 118.9,364.1 Z" fill="url(#seg2)"/>
    <path d="M 382.5,112.4 A 420,420 0 0 1 641.4,112.4 Q 665.9,121.2 656.4,145.4 L 598.5,292.4 Q 589.0,316.6 564.2,308.6 A 210,210 0 0 0 459.8,308.6 Q 435.0,316.6 425.5,292.4 L 367.6,145.4 Q 358.1,121.2 382.5,112.4 Z" fill="url(#seg3)"/>
    <path d="M 743.7,161.7 A 420,420 0 0 1 905.1,364.1 Q 913.5,388.7 888.6,396.3 L 737.6,442.7 Q 712.7,450.3 703.6,426.0 A 210,210 0 0 0 638.4,344.3 Q 616.8,330.0 629.7,307.5 L 708.6,170.5 Q 721.5,148.0 743.7,161.7 Z" fill="url(#seg4)"/>
    <path d="M 930.3,474.7 A 420,420 0 0 1 872.7,727.1 Q 858.7,749.0 837.3,734.3 L 706.8,645.2 Q 685.4,630.5 698.7,608.2 A 210,210 0 0 0 721.9,506.3 Q 719.6,480.4 745.3,476.5 L 901.5,452.8 Q 927.2,448.9 930.3,474.7 Z" fill="url(#seg5)"/>
  </g>

  <path d="
    M 760,320
    L 450,603
    A 78,78 0 0 0 574,697
    Z"
