<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="seg1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b52ff"/>
      <stop offset="1" stop-color="#19a7ff"/>
    </linearGradient>
    <linearGradient id="seg2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1466ff"/>
      <stop offset="1" stop-color="#2bcaf2"/>
    </linearGradient>
    <linearGradient id="seg3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#18abf6"/>
      <stop offset="1" stop-color="#4bddaf"/>
    </linearGradient>
    <linearGradient id="seg4" x1="0" y1="1" x2="1" y2="0">
