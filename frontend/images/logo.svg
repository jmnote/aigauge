    <path d="M 151.3,727.1 A 420,420 0 0 1 93.7,474.7 Q 96.8,448.9 122.5,452.8 L 234.2,469.8 Q 259.9,473.7 257.3,499.5 A 255,255 0 0 0 287.9,633.7 Q 301.5,655.9 280.0,670.6 L 186.7,734.4 Q 165.3,749.0 151.3,727.1 Z" fill="url(#seg1)"/>
    <path d="M 118.9,364.1 A 420,420 0 0 1 280.3,161.7 Q 302.5,148.0 315.4,170.5 L 371.8,268.5 Q 384.8,291.0 362.9,305.1 A 255,255 0 0 0 277.1,412.7 Q 268.2,437.1 243.4,429.5 L 135.4,396.3 Q 110.5,388.7 118.9,364.1 Z" fill="url(#seg2)"/>
    <path d="M 382.5,112.5 A 420,420 0 0 1 641.5,112.5 Q 665.9,121.2 656.4,145.4 L 615.0,250.6 Q 605.5,274.7 580.8,266.5 A 255,255 0 0 0 443.2,266.5 Q 418.5,274.7 409.0,250.6 L 367.6,145.4 Q 358.1,121.2 382.5,112.5 Z" fill="url(#seg3)"/>
    <path d="M 743.7,161.7 A 420,420 0 0 1 905.1,364.1 Q 913.5,388.7 888.6,396.3 L 780.6,429.5 Q 755.8,437.1 746.9,412.7 A 255,255 0 0 0 661.1,305.1 Q 639.2,291.0 652.2,268.5 L 708.6,170.5 Q 721.5,148.0 743.7,161.7 Z" fill="url(#seg4)"/>
    <path d="M 930.3,474.7 A 420,420 0 0 1 872.7,727.1 Q 858.7,749.0 837.3,734.4 L 744.0,670.6 Q 722.5,655.9 736.1,633.7 A 255,255 0 0 0 766.7,499.5 Q 764.1,473.7 789.8,469.8 L 901.5,452.8 Q 927.2,448.9 930.3,474.7 Z" fill="url(#seg5)"/>
  </g>

  <path d="
    M 760,320
    L 450,603
    A 78,78 0 0 0 574,697
