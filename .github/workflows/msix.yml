name: Build MSIX

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: pwsh
        run: .\build.ps1 -Task test

      - name: Build MSIX
        shell: pwsh
        run: .\build.ps1 -Task package -Architecture x64

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigauge-msix-${{ github.sha }}
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 14
