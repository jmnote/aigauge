name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use the stable vX.Y.Z format: $env:RELEASE_TAG"
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-winres
        shell: pwsh
        # Embeds the AI Gauge icon and file metadata into aigauge.exe (see
        # hack/prepare-windows-resources.ps1). The MSIX itself gets its icon
        # from Package.appxmanifest regardless, but this same aigauge.exe is
        # also uploaded directly as the portable release executable, and
        # without this resource step that one has no icon at all.
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(gofmt -l main.go internal)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files.Count -gt 0) {
            $files | ForEach-Object { Write-Error "gofmt required: $_" }
            exit 1
          }

      - name: Run tests and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSIX from release tag
        shell: pwsh
        run: .\build.ps1 -Task package -Architecture x64 -Version "${{ github.ref_name }}" -ReleaseArtifact

      - name: Copy portable executable
        shell: pwsh
        run: |
          # build.ps1's package task already built aigauge.exe at the repo root
          # to produce the MSIX above (hack/package-msix.ps1 builds it, then
          # copies it into the MSIX staging directory) - this just also copies
          # it into dist/ under the MSIX's own name, so someone who doesn't
          # want to install anything can run it directly. Named after the
          # MSIX (not a separately computed version string) so the two never
          # drift apart.
          $msix = Get-ChildItem -LiteralPath dist -Filter *.msix -File | Select-Object -First 1
          if (-not $msix) {
            throw "No MSIX package was produced; cannot name the portable executable after it."
          }
          $exeName = [IO.Path]::GetFileNameWithoutExtension($msix.Name) + ".exe"
          Copy-Item -LiteralPath aigauge.exe -Destination (Join-Path dist $exeName)

      - name: Create checksums
        shell: pwsh
        run: |
          # -Path (wildcard) rather than -LiteralPath: -Include is silently
          # ignored without either a wildcard path or -Recurse, which would
          # pick up hack/package-msix.ps1's own build-time copy of aigauge.exe
          # under dist\staging\<arch>\ - not part of the release - alongside
          # everything else in the tree. This form stays non-recursive and
          # matches dist\'s own contents only.
          $packages = @(Get-ChildItem -Path (Join-Path dist '*') -Include *.msix, *.exe -File)
          if ($packages.Count -eq 0) {
            throw "No release artifacts were produced."
          }
          $checksums = $packages | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload MSIX, executable, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-msix
          path: |
            dist/*.msix
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download MSIX and executable
        uses: actions/download-artifact@v5
        with:
          name: release-msix
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            dist/*.msix \
            dist/*.exe \
            dist/SHA256SUMS.txt

  publish:
    needs: package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release package
        uses: actions/download-artifact@v5
        with:
          name: release-msix
          path: dist

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Set up Ruby for submission metadata
        if: hashFiles('docs/partner-center/submission-overrides.yaml') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate and convert Store submission overrides
        if: hashFiles('docs/partner-center/submission-overrides.yaml') != ''
        shell: pwsh
        run: |
          ruby hack/validate-store-submission.rb `
            docs/partner-center/submission-overrides.yaml submission-overrides.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: Publish to Microsoft Store
        shell: pwsh
        env:
          STORE_APP_ID: 9MT65KM56P99
        run: |
          $msix = Get-ChildItem -LiteralPath dist -Filter *.msix -File | Select-Object -First 1
          if (-not $msix) {
            throw "No MSIX package was downloaded."
          }
          $overridesPath = Join-Path $env:GITHUB_WORKSPACE "submission-overrides.json"
          if (-not (Test-Path -LiteralPath $overridesPath -PathType Leaf)) {
            msstore publish --inputFile $msix.FullName --appId $env:STORE_APP_ID
            exit $LASTEXITCODE
          }

          # Keep the submission in draft state while adding the certification
          # notes, then commit the complete submission. The CLI's submission
          # metadata command accepts the full JSON returned by `submission get`.
          msstore publish --inputFile $msix.FullName --appId $env:STORE_APP_ID --noCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Invoke-MsStore([string[]]$Arguments) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = (Get-Command msstore).Source
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($argument in $Arguments) { $info.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $info
            if (-not $process.Start()) { throw "Unable to start Microsoft Store CLI." }
            # Consume both redirected streams concurrently. Reading either one
            # synchronously first can deadlock when the other pipe fills up.
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            if ($stdout) { Write-Output $stdout }
            if ($process.ExitCode -ne 0) {
              if ($stderr) { Write-Error $stderr }
              throw "Microsoft Store CLI failed with exit code $($process.ExitCode)."
            }
          }

          function Find-JsonObjectEnd([string]$Text, [int]$Start) {
            # Return the index of the '}' that closes the object opened at
            # $Start, counting brace depth and ignoring braces inside string
            # literals, or -1 if the object is never closed.
            $depth = 0
            $inString = $false
            $escaped = $false
            for ($i = $Start; $i -lt $Text.Length; $i++) {
              $char = $Text[$i]
              if ($inString) {
                if ($escaped) { $escaped = $false }
                elseif ($char -eq '\') { $escaped = $true }
                elseif ($char -eq '"') { $inString = $false }
                continue
              }
              if ($char -eq '"') { $inString = $true; continue }
              if ($char -eq '{') { $depth++ }
              elseif ($char -eq '}') {
                $depth--
                if ($depth -eq 0) { return $i }
              }
            }
            return -1
          }

          function Get-SubmissionObject([string]$Text) {
            # The msstore CLI may print diagnostic/log text containing
            # braces before or after the actual submission JSON, so this
            # cannot assume the JSON starts at the first '{' in the output.
            # Instead, try every '{' as a possible start, extract the
            # balanced object there, and return the first submission object.
            $searchFrom = 0
            while ($true) {
              $start = $Text.IndexOf('{', $searchFrom)
              if ($start -lt 0) { return $null }
              $end = Find-JsonObjectEnd -Text $Text -Start $start
              if ($end -lt 0) {
                $searchFrom = $start + 1
                continue
              }
              $candidate = $Text.Substring($start, $end - $start + 1)
              try {
                $parsed = $candidate | ConvertFrom-Json -ErrorAction Stop
                if ($parsed -is [PSCustomObject] -and
                    $parsed.PSObject.Properties['Id'] -and
                    $parsed.PSObject.Properties['Listings']) {
                  return $parsed
                }
              } catch {
                # Not valid JSON - keep scanning from the next '{'.
              }
              $searchFrom = $start + 1
            }
          }

          $raw = (Invoke-MsStore @("submission", "get", $env:STORE_APP_ID) | Out-String).Trim()
          $submission = Get-SubmissionObject $raw
          if (-not $submission) {
            throw "Microsoft Store CLI did not return submission JSON."
          }
          $overrides = Get-Content -LiteralPath $overridesPath -Raw | ConvertFrom-Json
          function Merge-SubmissionOverrides($target, $source) {
            foreach ($property in $source.PSObject.Properties) {
              $existing = $target.PSObject.Properties[$property.Name]
              if ($property.Value -is [PSCustomObject] -and $existing -and $existing.Value -is [PSCustomObject]) {
                Merge-SubmissionOverrides $existing.Value $property.Value
              } elseif ($existing) {
                $target.$($property.Name) = $property.Value
              } else {
                $target | Add-Member -NotePropertyName $property.Name -NotePropertyValue $property.Value
              }
            }
            return $target
          }
          $submission = Merge-SubmissionOverrides $submission $overrides
          $metadata = $submission | ConvertTo-Json -Depth 100 -Compress
          Invoke-MsStore @("submission", "updateMetadata", $env:STORE_APP_ID, $metadata) | Write-Host
          Invoke-MsStore @("submission", "publish", $env:STORE_APP_ID) | Write-Host
