name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(gofmt -l main.go internal)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files.Count -gt 0) {
            $files | ForEach-Object { Write-Error "gofmt required: $_" }
            exit 1
          }

      - name: Run tests and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSIX
        shell: pwsh
        run: .\build.ps1 -Task package -Architecture x64 -SkipWindowsResources -ReleaseArtifact

      - name: Create checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter *.msix -File)
          if ($packages.Count -eq 0) {
            throw "No MSIX packages were produced."
          }
          $checksums = $packages | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload MSIX and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-msix
          path: |
            dist/*.msix
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download MSIX
        uses: actions/download-artifact@v5
        with:
          name: release-msix
          path: dist

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            dist/*.msix \
            dist/SHA256SUMS.txt
