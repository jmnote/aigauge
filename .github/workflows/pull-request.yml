name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Ruby for submission metadata
        if: hashFiles('docs/partner-center/submission-overrides.yaml') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate Store submission overrides
        if: hashFiles('docs/partner-center/submission-overrides.yaml') != ''
        shell: pwsh
        run: ruby hack/validate-store-submission.rb docs/partner-center/submission-overrides.yaml

      - name: Run tests
        shell: pwsh
        run: .\build.ps1 -Task test

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(gofmt -l main.go internal)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files.Count -gt 0) {
            $files | ForEach-Object { Write-Error "gofmt required: $_" }
            exit 1
          }

      - name: Run go vet
        shell: pwsh
        run: go vet ./...

      - name: Build application
        shell: pwsh
        run: .\build.ps1 -Task build -SkipWindowsResources

  package:
    needs: check
    runs-on: windows-latest
    concurrency:
      group: package-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build MSIX
        shell: pwsh
        run: .\build.ps1 -Task package -Architecture x64 -Version 0.0.0 -SkipWindowsResources
